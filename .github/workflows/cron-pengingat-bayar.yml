name: Cron Pengingat Batas Bayar (3 Jam)

on:
  schedule:
    # Berjalan setiap 15 menit
    - cron: '*/15 * * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab GitHub Actions

jobs:
  trigger-cron:
    name: Panggil Endpoint Pengingat Bayar LMS Pijar Aksara
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cron API
        run: |
          echo "Memanggil endpoint pengingat batas bayar..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'pijar_aksara_cron_secret_secure_key_123' }}" \
            -H "Content-Type: application/json" \
            https://lms-pijar-aksara.netlify.app/api/cron/pengingat-bayar)
          
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Cron berhasil dieksekusi dengan status $HTTP_STATUS."
          else
            echo "Cron gagal dengan status $HTTP_STATUS."
            exit 1
          fi
